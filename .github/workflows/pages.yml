name: Deploy Agent Control Center
on:
  push:
    branches: [main]
    paths:
      - 'agent-control/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript syntax
        run: node --check agent-control/site/app.js
      - name: Validate UI interactions
        run: node agent-control/scripts/validate-ui.mjs
      - name: Build dashboard
        run: node agent-control/scripts/build-data.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: agent-control/dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
